  <script>
    /* Gráficos: Chart.js com CDN reserva. Sem internet, o painel continua com as tabelas. */
    window.__chartLibs = (function () {
      function load(srcs) {
        return new Promise(function (resolve) {
          var i = 0;
          (function next() {
            if (i >= srcs.length) { resolve(false); return; }
            var s = document.createElement('script');
            s.src = srcs[i++]; s.async = false;
            s.onload = function () { resolve(true); };
            s.onerror = function () { s.remove(); next(); };
            document.head.appendChild(s);
          })();
        });
      }
      return load([
        'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js',
        'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js'
      ]).then(function (ok) {
        return ok ? load([
          'https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js'
        ]) : false;
      });
    })();
  </script>
