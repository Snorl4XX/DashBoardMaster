<!-- Gerado por gerar-appscript.js a partir de public/app.css: não edite aqui. -->
<style>
/* =========================================================
   J&T EXPRESS · Painel do Sorter (separado do DashMaster) — branco/vermelho, tema escuro por padrão
   ========================================================= */
:root{
  color-scheme: light;
  --red:#E60012; --red-600:#C8000F; --red-50:#FFF1F2; --red-200:#FFC2C8;
  --ink:#1F2430; --ink-2:#434A5B; --muted:#6B7280; --muted-2:#9AA0AB;
  --line:#ECECEF; --line-2:#F3F3F5; --bg:#F6F6F8; --card:#FFFFFF;
  --soft:#F6F6F8; --soft-2:#F1F1F4; --field-line:#DFDFE4; --field-line-2:#CFCFD6; --row-alt:#FBFBFC; --row-hover:#FFF5F6;
  --good:#15803D; --bad:#B42318; --bad-bg:#FDEBEC; --bad-line:#F7C3C7; --amber:#F59E0B;
  --radius:16px;
  --shadow:0 1px 2px rgba(31,36,48,.04),0 8px 24px rgba(31,36,48,.06);
  --shadow-lg:0 12px 40px rgba(31,36,48,.14);
  --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",Arial,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --red-600:#FF5A67; --red-50:rgba(230,0,18,.16); --red-200:rgba(255,90,103,.55);
  --ink:#F2F3F5; --ink-2:#C9CCD4; --muted:#9BA1AD; --muted-2:#727885;
  --line:#2A2D36; --line-2:#22252D; --bg:#0E0F13; --card:#17191F;
  --soft:#1E2128; --soft-2:#272A33; --field-line:#353946; --field-line-2:#4B505E; --row-alt:#1B1D24; --row-hover:rgba(230,0,18,.12);
  --good:#3DD07A; --bad:#FF6B76; --bad-bg:rgba(230,0,18,.18); --bad-line:rgba(230,0,18,.45);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{max-width:1500px;margin:0 auto;padding:0 28px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* topo */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:18px;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{background:var(--red);color:#fff;border-radius:11px;padding:8px 11px;font-weight:900;font-size:19px;letter-spacing:-.5px;font-style:italic;box-shadow:0 6px 16px rgba(230,0,18,.25);line-height:1}
.brand-copy{display:flex;flex-direction:column;line-height:1.1}
.brand-copy strong{font-size:14px;letter-spacing:2.4px;color:var(--red);font-style:italic}
:root[data-theme="dark"] .brand-copy strong{color:#FF3B4A}
.brand-copy span{font-size:11px;color:var(--muted);margin-top:5px}
.title-wrap{min-width:0;flex:1}
.title-wrap h1{margin:0 0 2px;font-size:25px;line-height:1.15;letter-spacing:-.6px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-wrap p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow);transition:.18s}
.icon-btn:hover{color:var(--red-600);border-color:var(--red-200)}
#themeBtn .ico-sun{display:none} :root[data-theme="dark"] #themeBtn .ico-sun{display:block} :root[data-theme="dark"] #themeBtn .ico-moon{display:none}
.lang-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.lang-btn{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);transition:.18s}
.lang-btn[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(230,0,18,.25)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;white-space:nowrap;transition:background .18s,box-shadow .18s,border-color .18s}
.btn-light{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.btn-light:hover{border-color:var(--red-200);color:var(--red-600)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(230,0,18,.22);height:42px}
.btn-red:hover{background:#C8000F}
.btn:disabled{opacity:.6;cursor:default}
.btn.spin svg{animation:spin 1s linear infinite}
.progress{position:sticky;top:0;height:3px;overflow:hidden;z-index:35;opacity:0;transition:opacity .2s}
.progress.on{opacity:1}
.progress span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:slide 1.1s ease-in-out infinite}

/* período */
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 16px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;flex:0 1 170px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}
input[type=date]{width:100%;height:42px;border:1px solid var(--field-line);border-radius:12px;background:var(--card);padding:0 12px;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s}
input[type=date]:hover{border-color:var(--field-line-2)}
input[type=date]:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,18,.10)}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;order:99;flex:1 1 100%;padding-top:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-2);transition:.16s}
.chip:hover{border-color:var(--red-200);color:var(--red-600)}
.chip.active{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}

/* filtros */
.filters{margin-top:12px;padding:14px 16px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.filter-grid .field{flex:none}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{width:100%;height:42px;border:1px solid var(--field-line);border-radius:12px;background:var(--card);padding:0 34px 0 12px;font-size:13.5px;font-weight:600;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color .18s,box-shadow .18s}
select:hover{border-color:var(--field-line-2)}
select:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,18,.10)}
select.on{border-color:var(--red-200);background:var(--red-50);color:var(--red-600)}
.btn-sm{padding:7px 12px;font-size:12px}
.warn-line{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#B45309;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:8px 12px}
:root[data-theme="dark"] .warn-line{color:#F5A524}

/* situação da leitura */
.status{margin-top:12px;padding:12px 16px;display:grid;gap:8px}
.status-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.status-line b{color:var(--ink)}
.status-err{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--bad);background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:12px;padding:10px 12px}
.status-err div{display:grid;gap:2px} .status-err small{color:var(--muted)}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);vertical-align:middle;flex:none}
.live-dot.on{background:var(--good);animation:livePulse 1.8s infinite}

/* cartões */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden;min-height:118px;display:flex;flex-direction:column;animation:rise .35s ease both}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:7px}
.kpi-label svg{width:15px;height:15px;color:var(--red)}
.kpi-label i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpi-value{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:8px;line-height:1.05}
.kpi-sub small{display:block;margin-top:3px}
.kpi-value.text{font-size:19px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi-sub b{color:var(--ink-2)}
.kpi-foot{margin-top:auto;padding-top:10px}
.bar{height:6px;border-radius:99px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.delta svg{width:14px;height:14px;stroke-width:2.6}
.kpi-hero{grid-column:span 2;grid-row:span 2;background:linear-gradient(135deg,#F0101F 0%,var(--red) 40%,#B3000D 100%);border:0;color:#fff;padding:20px 22px;box-shadow:0 14px 34px rgba(230,0,18,.28)}
.kpi-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.kpi-hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.kpi-hero > *{position:relative;z-index:1}
.kpi-hero .kpi-label{color:rgba(255,255,255,.85)} .kpi-hero .kpi-label svg{color:#fff}
.kpi-hero .kpi-value{font-size:58px;letter-spacing:-2px;margin-top:10px;color:#fff}
.kpi-hero .kpi-sub{color:rgba(255,255,255,.88);font-size:13.5px}
.kpi-hero .kpi-sub b{color:#fff}
.hero-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#15803D;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.shift-kpi.now{box-shadow:0 0 0 2px var(--red) inset}
.shift-kpi.faded{opacity:.55}
.dev-line{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.dev-line i{width:10px;height:10px;border-radius:3px;flex:none}
.dev-line span{margin-left:auto;font-variant-numeric:tabular-nums}

/* gráficos */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.chart-card{padding:18px 20px 16px;min-width:0;display:flex;flex-direction:column;border-top:3px solid var(--red)}
.chart-card.full{grid-column:1/-1}
.chart-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.chart-ico{width:34px;height:34px;border-radius:10px;background:var(--red-50);color:var(--red);display:grid;place-items:center;flex:none}
.chart-titles{flex:1;min-width:0}
.chart-titles h3{margin:0;font-size:17px;letter-spacing:-.3px}
.chart-titles h3 .zh{color:var(--red);font-weight:700}
.chart-titles small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.chart-wrap{position:relative;height:300px}
.chart-wrap.large{height:360px}
.chart-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;background:repeating-linear-gradient(135deg,var(--row-alt) 0 10px,var(--soft) 10px 20px);border-radius:12px;padding:16px}
.chart-empty b{display:block;color:var(--ink-2);margin-bottom:4px}

/* tabela */
.table-card{margin-top:12px;padding:16px 18px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--red);font-weight:800}
.section-head h2{margin:2px 0 0;font-size:16px;letter-spacing:-.2px}
.count{font-size:12px;color:var(--muted);font-weight:700}
.table-scroll{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.data-table thead th{position:sticky;top:0;z-index:2;background:var(--red);color:#fff;text-align:left;padding:10px 12px;font-weight:700;white-space:nowrap;border-right:1px solid rgba(255,255,255,.16)}
.data-table thead th:last-child{border-right:0}
.data-table tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.data-table tbody tr:nth-child(even) td{background:var(--row-alt)}
.data-table tbody tr:hover td{background:var(--row-hover)}
.data-table .num-col{width:44px;color:var(--muted);text-align:right}
.data-table td.num,.data-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.data-table tr.cur td{background:var(--red-50);font-weight:700}
.data-table tr.total td{font-weight:800;border-top:2px solid var(--red);background:var(--soft-2);position:sticky;bottom:0}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted-2);text-align:center}
.foot b{display:block;margin-top:4px;color:var(--red);font-size:11.5px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-lg);font-size:13px;animation:toastIn .22s ease}
.toast.error{background:#9F1713;color:#fff} .toast.success{background:#166534;color:#fff}

/* TV (?tv=1): só os números, sem os controles */
body.tv .toolbar,body.tv .filters,body.tv .table-card,body.tv #refreshBtn,body.tv .lang-switch,body.tv #themeBtn{display:none}
body.tv .kpi-hero .kpi-value{font-size:72px}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media (prefers-reduced-motion:reduce){.live-dot.on,.progress span,.btn.spin svg{animation:none}.kpi{animation:none}}
@media (max-width:1180px){.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi-hero{grid-column:span 3;grid-row:auto;min-height:220px}}
@media (max-width:900px){.charts{grid-template-columns:1fr}.top{flex-wrap:wrap}.title-wrap{flex:1 1 100%;order:3}}
@media (max-width:640px){.page{padding:0 14px 20px}.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-hero{grid-column:span 2}.kpi-hero .kpi-value{font-size:44px}.field{flex:1 1 140px}}
@media (max-width:380px){.kpi-grid{grid-template-columns:1fr}.kpi-hero{grid-column:auto}}
</style>
