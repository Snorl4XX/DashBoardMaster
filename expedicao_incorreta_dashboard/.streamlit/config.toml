# Só neste computador: o app escuta em 127.0.0.1 e não manda estatísticas de uso.
# Para abrir de outro computador da rede, veja o LEIA-ME (precisa de senha: DASHBOARD_PASSWORD).
[server]
address = "127.0.0.1"
port = 8503
headless = true
maxUploadSize = 100

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#E60012"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"
