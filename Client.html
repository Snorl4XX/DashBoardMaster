  function bootDone() { var b = $('#bootScreen'); if (b) { b.classList.add('done'); setTimeout(function () { b.remove(); }, 400); } }

    var libs = Promise.race([window.__chartLibs || Promise.resolve(false), new Promise(function (r) { setTimeout(r, 8000); })]);
    Promise.all([call('getAppBootstrap'), libs]).then(function (all) {
      var boot = all[0];
      if (window.Chart) setupChartDefaults();
      else if (window.__chartLibs) window.__chartLibs.then(function (ok) {

      var anchor = anchorDate(state.indicator);
      state.from = anchor; state.to = anchor;
      var rTo = latestOverall();
      state.results.to = rTo;
      state.results.from = boot.historyStart && boot.historyStart <= rTo ? maxIso(boot.historyStart, Core.addDays(rTo, -89)) : Core.addDays(rTo, -89);

  function maxIso(a, b) { return a > b ? a : b; }

  // ------------------------------------------------------------------ dashboard: carga
  function loadDashboard(opts) {

    var seq = ++state.seq, c = cfg();
    if (!opts.silent) setBusy(true);

    var slow = setTimeout(function () { if (seq === state.seq && !opts.silent) toast(t('slowLoading')); }, 12000);
    var req = {from: state.from, to: state.to};
    if (c && c.grouped) req.filters = filtersObj();

      if (seq !== state.seq) return;

      var sm = res.summary;

  function renderHeader() {

  function renderDashboard() {

  /**
   * Avaria com UMA opção de "Pedidos principais/filhos" (Config.gs → orderKinds): a taxa e a quantidade
   * oficiais passam a ser as do JMS para essa opção (o volume também muda), como na tela do JMS. Essa opção
   * não conta como "filtro" no cartão: a taxa já é a dela. Todos (ou as duas opções) = taxa de sempre.

    if (sel && sel.length === 1 && rv) {

      if (kind && rv[kind] && rv[kind].length) {

        return {rates: rv[kind], filters: rest, kind: kind, label: sel[0], estimated: rv[kind].some(function (r) { return r.estimated; })};
      }

  }

  // ------------------------------------------------------------------ filtros: lista suspensa multi-seleção

  /**

      options: {responsive: true, maintainAspectRatio: false, animation: {duration: 600}, interaction: {mode: 'index', intersect: false}, layout: {padding: {top: 34, right: 36}},
        plugins: {legend: {display: false},
          tooltip: {callbacks: {label: function (ctx) {
            if (ctx.datasetIndex === 1) return ' ' + t('goal') + ': ' + goalText(c.goal);
            var p = points[ctx.dataIndex]; return p.rate === null ? ' —' : ' ' + t('rate') + ': ' + fmtRate(p.rate, c.goal) + ' · ' + p.days + ' ' + t('days') + (isNum(p.errors) ? ' · ' + tx(c, 'errors') + ': ' + fmtInt(p.errors) : '');
          }}},
          datalabels: {align: 'top', clip: false, padding: 0, labels: {
            rate: {offset: 17, color: function (ctx) { var p = points[ctx.dataIndex]; return p.met === false ? BAD : INK; }, font: {size: 11, weight: '800'},
              formatter: function (v) { return fmtRate(v, c.goal); }, display: function (ctx) { return ctx.datasetIndex === 0 && showResLabel(ctx, points, vals); }},
            qty: {offset: 4, color: MUTED, font: {size: 10.5, weight: '700'},
              formatter: function (v, ctx) { var p = points[ctx.dataIndex]; return isNum(p.errors) ? fmtInt(p.errors) : ''; },
              display: function (ctx) { return ctx.datasetIndex === 0 && showResLabel(ctx, points, vals) && isNum(points[ctx.dataIndex].errors); }}
          }}},
        scales: {x: {grid: {display: false}, border: {display: false}, ticks: {autoSkip: true, maxTicksLimit: 16, maxRotation: 0}},
          y: {grid: {color: GRID}, border: {display: false}, grace: '22%', afterDataLimits: noNegative, ticks: {callback: function (v) { return fmtRate(v, c.goal, yDigits); }}}}}
    };
  }
  /**
   * Etiquetas dos Resultados (taxa em cima, quantidade do dia embaixo). Se não couberem todas,
   * mostra uma a cada N pontos, mais o maior, o menor e o último.
   */
  function showResLabel(ctx, points, vals) {
    var i = ctx.dataIndex, v = vals[i];
    if (v === null || v === undefined) return false;
    var x = ctx.chart.scales.x, n = points.length, slot = x && n ? x.width / n : 100;
    if (slot >= 40 || i === n - 1) return true;
    var valid = vals.filter(isNum);
    if (v === Math.max.apply(null, valid) || v === Math.min.apply(null, valid)) return true;
    return i % Math.ceil(40 / slot) === 0;
  }
  /** Casas decimais da taxa do turno: 3 abaixo de 0,1% e 4 abaixo de 0,01% (Avaria), senão tudo vira "0,01%". */
  function rateDigits(points) {
    var mx = Math.max.apply(null, [0].concat(points.map(function (p) { return p.rate; }).filter(isNum)));
    return mx > 0 && mx < 0.01 ? 4 : mx > 0 && mx < 0.1 ? 3 : 2;
  }
  /** Taxa do turno (%) por período, em colunas na cor do turno, com a taxa em cima de cada coluna. */
  function resultShiftConfig(points, shift, per, c) {
    var vals = points.map(function (p) { return p.rate; }), rd = rateDigits(points), yDigits = rd >= 3 ? rd : pctDigits(vals.concat([0]));
    return {
      type: 'bar',
      data: {labels: points.map(function (p) { return fmtPeriodKey(p.key, per); }), datasets: [{label: t('shiftRate', {s: shift}), data: vals,
        backgroundColor: SHIFT_COLORS[shift], borderRadius: 4, borderSkipped: 'start', maxBarThickness: 30}]},
      plugins: plugins(),
      options: {responsive: true, maintainAspectRatio: false, animation: {duration: 600}, layout: {padding: {top: 32}},
        plugins: {legend: {display: false}, tooltip: {callbacks: {label: function (ctx) {
          var p = points[ctx.dataIndex];
          return p.rate === null ? ' —' : [' ' + t('shiftRate', {s: shift}) + ': ' + fmtRate(p.rate, c.goal, rd), ' ' + tx(c, 'shiftErrors', {s: shift}) + ': ' + fmtInt(p.rateCount) + ' · ' +
            t('totalVolume') + ': ' + fmtInt(p.base), ' ' + tx(c, 'shareOfErrors', {p: fmtPct(p.pct, 1)})];
        }}},
          datalabels: {anchor: 'end', align: 'end', clip: false, padding: 0, labels: {
            rate: {offset: 16, color: INK, font: {size: 11, weight: '800'}, formatter: function (v) { return fmtRate(v, c.goal, rd); },
              display: function (ctx) { return dv(ctx) !== null && dv(ctx) > 0 && showResLabel(ctx, points, vals); }},
            qty: {offset: 3, color: MUTED, font: {size: 10.5, weight: '700'}, formatter: function (v, ctx) { return fmtInt(points[ctx.dataIndex].rateCount); },
              display: function (ctx) { return dv(ctx) !== null && dv(ctx) > 0 && showResLabel(ctx, points, vals); }}
          }}},
        scales: {x: {grid: {display: false}, border: {color: '#D9DBE1'}, ticks: {autoSkip: true, maxTicksLimit: 14, maxRotation: 0, color: INK, font: {weight: '700'}}},
          y: {beginAtZero: true, grace: '22%', grid: {color: GRID}, border: {display: false}, ticks: {callback: function (v) { return fmtRate(v, c.goal, yDigits); }}}}}
    };
  }
  function resultsTable(points, c, r) {
    var h, rows;
    if (r.shift === 'all') {
      h = '<th>' + esc(t('period')) + '</th><th class="num">' + esc(t('rate')) + '</th><th class="num">' + esc(t('goal')) + '</th><th>' + esc(t('status')) + '</th><th class="num">' + esc(tx(c, 'errors')) + '</th><th class="num">' + esc(t('days')) + '</th>';
      rows = points.slice().reverse().filter(function (p) { return p.rate !== null; }).map(function (p) {
        return '<tr><td>' + esc(fmtPeriodKey(p.key, r.periodicity)) + '</td><td class="num"><b>' + fmtRate(p.rate, c.goal) + '</b></td><td class="num">' + esc(goalText(c.goal)) + '</td><td>' +
          (p.met === null ? esc(t('noGoal')) : p.met ? '<span style="color:var(--good);font-weight:700">✓ ' + esc(t('inGoal')) + '</span>' : '<span style="color:var(--bad);font-weight:700">✗ ' + esc(t('outGoal')) + '</span>') +
          '</td><td class="num">' + fmtInt(p.errors) + '</td><td class="num">' + p.days + '</td></tr>';
      });
    } else {
      h = '<th>' + esc(t('period')) + '</th><th class="num">' + esc(t('shiftRate', {s: r.shift})) + '</th><th class="num">' + esc(tx(c, 'shiftErrors', {s: r.shift})) + '</th><th class="num">' +
        esc(t('totalVolume')) + '</th><th class="num">' + esc(t('share')) + '</th><th class="num">' + esc(t('days')) + '</th>';
      var rd = rateDigits(points);
      rows = points.slice().reverse().filter(function (p) { return p.count !== null; }).map(function (p) {
        return '<tr><td>' + esc(fmtPeriodKey(p.key, r.periodicity)) + '</td><td class="num"><b>' + fmtRate(p.rate, c.goal, rd) + '</b></td><td class="num">' + fmtInt(p.count) + '</td><td class="num">' +
          fmtInt(p.base) + '</td><td class="num">' + fmtPct(p.pct, 1) + '</td><td class="num">' + p.days + '</td></tr>';
      });
    }
    return '<table class="data-table"><thead><tr>' + h + '</tr></thead><tbody>' + (rows.join('') || '<tr class="empty-row"><td colspan="6">' + esc(t('noData')) + '</td></tr>') + '</tbody></table>';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
