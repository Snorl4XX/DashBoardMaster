  // ------------------------------------------------------------------ avisos e carregamento
  function toast(msg, type, opts) {

      var a = document.createElement('a'); a.href = opts.link.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = ' ' + opts.link.text + ' ↗'; span.appendChild(a);
    }
    var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', t('close')); x.innerHTML = '✕';
    x.addEventListener('click', function () { el.remove(); });

  function bootDone() { var b = $('#bootScreen'); if (b) { b.classList.add('done'); setTimeout(function () { b.remove(); }, 400); } }

  // ------------------------------------------------------------------ inicialização
  function pickLang() {
    if (BOOT.lang === 'zh' || BOOT.lang === 'pt') return BOOT.lang;

  function init() {
    state.lang = pickLang();
    applyStaticI18n();
    bindEvents();
    if (!Core) { showAlert('Core.gs não foi carregado. Verifique se todos os arquivos foram copiados.'); bootDone(); return; }
    var libs = Promise.race([window.__chartLibs || Promise.resolve(false), new Promise(function (r) { setTimeout(r, 8000); })]);
    Promise.all([call('getAppBootstrap'), libs]).then(function (all) {
      var boot = all[0];
      if (window.Chart) setupChartDefaults();

        // Biblioteca chegou depois do tempo limite: redesenha com gráficos.
        if (!ok || !window.Chart || state.chartDefaultsSet) return;
        setupChartDefaults();
        if (state.view === 'results') renderResults(); else if (state.data) renderDashboard();
      });
      state.boot = boot;
      state.catalog = boot.catalog || [];
      state.catalog.forEach(function (c) { state.catalogMap[c.key] = c; });
      $('#appVersion').textContent = 'v' + boot.app.version;
      $('#brandCenter').textContent = boot.center || 'SP GRU';
      $('#eyebrowCenter').textContent = boot.center || 'SP GRU';
      if (!boot.initialized) { $('#main').classList.add('no-data'); showAlert(t('setupText'), 'warn'); return; }
      state.indicator = BOOT.indicator && state.catalogMap[BOOT.indicator] ? BOOT.indicator : (state.catalog[0] ? state.catalog[0].key : 'wrong_send');
      var anchor = anchorDate(state.indicator);
      state.from = anchor; state.to = anchor;
      var rTo = latestOverall();
      state.results.to = rTo;
      state.results.from = boot.historyStart && boot.historyStart <= rTo ? maxIso(boot.historyStart, Core.addDays(rTo, -89)) : Core.addDays(rTo, -89);
      buildNav(); buildSelects(); buildPresets(); updateSidebarStatus(boot.sync, boot.lastUpdated);

  function maxIso(a, b) { return a > b ? a : b; }
  function anchorDate(key) {

  function presetList() {

      ? [['preset30', 30], ['preset90', 90], ['preset180', 182], ['preset365', 365], ['presetAll', 'all']]
      : [['presetLastDay', 1], ['preset7', 7], ['preset30', 30], ['presetMonth', 'month'], ['presetAll', 'all']];

  function presetRange(p) {

    var hs = state.boot && state.boot.historyStart && state.boot.historyStart <= anchor ? state.boot.historyStart : null;
    if (p === 'month') return {from: anchor.slice(0, 8) + '01', to: anchor};
    if (p === 'all') return {from: hs ? maxIso(hs, Core.addDays(anchor, -365)) : Core.addDays(anchor, -365), to: anchor};

  function buildPresets() {

    $$('.chip', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-p'), r = presetRange(isNaN(Number(v)) ? v : Number(v));

        applyDates();

  function currentRange() { return state.view === 'results' ? {from: state.results.from, to: state.results.to} : {from: state.from, to: state.to}; }
  function setDateInputs(from, to) {

  function applyDates() {

  function setView(view) {

  // ------------------------------------------------------------------ dashboard: carga
  function loadDashboard(opts) {
    opts = opts || {};
    if (state.view !== 'dashboard') setView('dashboard'); else { setDateInputs(state.from, state.to); highlightPreset(); }
    var seq = ++state.seq, c = cfg();
    if (!opts.silent) setBusy(true);
    if (opts.resetFilters) { state.filters = {}; state.table = {sortKey: null, sortDir: 'desc', page: 1, query: ''}; $('#tableFind').value = ''; }
    renderHeader();
    return call('getDashboardData', state.indicator, {from: state.from, to: state.to}).then(function (res) {
      if (seq !== state.seq) return;
      state.data = {meta: res.meta, rates: res.rates || [], rows: Core.decodeDataset(res.dataset)};
      state.from = res.meta.from; state.to = res.meta.to;
      setDateInputs(state.from, state.to); highlightPreset();
      var allowed = {};
      (c.filters || []).forEach(function (f) { allowed[f.key] = 1; });
      Object.keys(state.filters).forEach(function (k) { if (!allowed[k]) delete state.filters[k]; });
      state.table.page = 1;
      hideAlert();
      $('#main').classList.remove('awaiting');
      if (opts.resetFilters || !Object.keys(state.dropdowns).length || state.builtFor !== state.indicator) buildFilterGrid();
      renderDashboard();
      updateSidebarStatus(res.meta.sync, res.meta.lastRateSyncedAt);
    }).catch(function (e) {
      if (seq !== state.seq) return;

      showAlert(e.message, null, function () { hideAlert(); loadDashboard(opts); });
      console.error(e);

  function onFiltersChanged() {

  // ------------------------------------------------------------------ filtros: lista suspensa multi-seleção
  function Dropdown(key) {
    var self = this;
    this.key = key; this.options = []; this.limit = 150; this.focusIdx = -1; this.isOpen = false;
    var el = document.createElement('div');
    el.className = 'dd';
    el.innerHTML = '<span class="dd-label" id="ddl-' + key + '">' + icon(key) + '<span></span></span>' +
      '<button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ddl-' + key + ' ddv-' + key + '">' +
      '<span class="dd-value" id="ddv-' + key + '"></span><span class="dd-count hidden"></span><span class="dd-caret" aria-hidden="true"></span></button>';
    this.el = el;
    this.btn = $('.dd-btn', el);
    this.btn.addEventListener('click', function () { self.isOpen ? self.close() : self.open(); });
    this.btn.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || ((e.key === 'Enter' || e.key === ' ') && !self.isOpen)) { e.preventDefault(); self.open(); self.moveFocus(0, true); }
    });
  }
  Dropdown.prototype.selected = function () { return state.filters[this.key] || new Set(); };
  Dropdown.prototype.refreshButton = function () {
    var sel = this.selected(), vals = Array.from(sel);
    $('.dd-label span', this.el).textContent = L(dimLabel(this.key));
    $('.dd-value', this.el).textContent = !vals.length ? t('all') : vals.length === 1 ? vlabel(this.key, vals[0]) : t('selectedN', {n: vals.length});
    var cnt = $('.dd-count', this.el);
    cnt.textContent = vals.length; cnt.classList.toggle('hidden', vals.length < 2);
    this.el.classList.toggle('has-value', vals.length > 0);
    this.btn.title = vals.map(function (v) { return vlabel(this.key, v); }, this).join(', ');
  };
  Dropdown.prototype.setOptions = function (list) { this.options = list || []; this.refreshButton(); if (this.isOpen) this.renderList(); };
  Dropdown.prototype.open = function () {
    var self = this;
    Object.keys(state.dropdowns).forEach(function (k) { if (state.dropdowns[k] !== self) state.dropdowns[k].close(); });
    if (this.isOpen) return;
    this.isOpen = true;
    this.limit = 150;
    var panel = document.createElement('div');
    panel.className = 'dd-panel';
    panel.innerHTML = '<div class="dd-head"><b class="dd-title"></b><span><button type="button" class="btn btn-ghost" data-act="clear"></button>' +
      '<button type="button" class="btn btn-ghost dd-sheet-title" data-act="close"></button></span></div>' +
      '<ul class="dd-list" role="listbox" aria-multiselectable="true" tabindex="-1"></ul>';
    this.el.appendChild(panel);
    this.panel = panel;
    $('.dd-title', panel).textContent = L(dimLabel(this.key));
    $('[data-act="clear"]', panel).textContent = t('clear');
    $('[data-act="close"]', panel).textContent = t('close');
    $('[data-act="clear"]', panel).addEventListener('click', function () { setFilter(self.key, new Set()); });
    $('[data-act="close"]', panel).addEventListener('click', function () { self.close(true); });
    var list = $('.dd-list', panel);
    list.addEventListener('click', function (e) {
      var li = e.target.closest('.dd-opt');
      if (li) { self.focusIdx = Number(li.getAttribute('data-i')); self.toggleValue(self.options[self.focusIdx].value); return; }
      if (e.target.closest('.dd-more')) { self.limit += 300; self.renderList(); }
    });
    list.addEventListener('keydown', function (e) { self.onKey(e); });
    var r = this.el.getBoundingClientRect();
    this.el.classList.toggle('align-right', r.left + 300 > window.innerWidth);
    this.btn.setAttribute('aria-expanded', 'true');
    this.renderList();
  };
  Dropdown.prototype.close = function (focusBtn) {
    if (!this.isOpen) return;
    this.isOpen = false;
    if (this.panel) this.panel.remove();
    this.panel = null;
    this.btn.setAttribute('aria-expanded', 'false');
    if (focusBtn) this.btn.focus();
  };
  Dropdown.prototype.renderList = function () {
    if (!this.panel) return;
    var sel = this.selected(), key = this.key, list = $('.dd-list', this.panel);
    var opts = this.options.slice(0, this.limit);
    if (!this.options.length) { list.innerHTML = '<li class="dd-empty">' + esc(t('noOptions')) + '</li>'; return; }
    var check = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
    var html = opts.map(function (o, i) {
      var text = vlabel(key, o.value);
      return '<li class="dd-opt' + (o.count === 0 ? ' zero' : '') + (i === this.focusIdx ? ' focus' : '') + '" role="option" id="ddo-' + key + '-' + i + '" data-i="' + i +
        '" aria-selected="' + sel.has(o.value) + '"><span class="dd-check">' + check + '</span><span class="dd-text" title="' + esc(text) + '">' + esc(text) +
        '</span><span class="dd-n">' + fmtInt(o.count) + '</span></li>';
    }, this).join('');
    if (this.options.length > this.limit) html += '<li><button type="button" class="dd-more">' + esc(t('showMore', {n: fmtInt(Math.min(300, this.options.length - this.limit))})) + '</button></li>';
    var scroll = list.scrollTop;
    list.innerHTML = html;
    list.scrollTop = scroll;
    if (this.focusIdx >= 0) list.setAttribute('aria-activedescendant', 'ddo-' + key + '-' + this.focusIdx);
  };
  Dropdown.prototype.moveFocus = function (idx, focusList) {
    var max = Math.min(this.options.length, this.limit) - 1;
    if (max < 0 || !this.panel) return;
    this.focusIdx = Math.max(0, Math.min(max, idx));
    var list = $('.dd-list', this.panel);
    $$('.dd-opt', list).forEach(function (li) { li.classList.remove('focus'); });
    var li = $('#ddo-' + this.key + '-' + this.focusIdx, list);
    if (li) { li.classList.add('focus'); li.scrollIntoView({block: 'nearest'}); }
    list.setAttribute('aria-activedescendant', 'ddo-' + this.key + '-' + this.focusIdx);
    if (focusList) list.focus();

      }
      card.innerHTML = '<div class="res-top"><span class="chart-ico">' + icon(s.key) + '</span><div><h3>' + esc(L(c.name)) + '</h3><small>' + esc(Lo(c.name)) + ' · ' +
        esc(t('goal')) + ' ' + esc(goalText(c.goal)) + '</small></div>' + top + '</div><div class="chart-wrap' + (single ? ' large' : '') + '"></div>' + (single ? '<div class="res-table"></div>' : '');
      grid.appendChild(card);
      var wrap = $('.chart-wrap', card);
      if (!hasData) { wrap.innerHTML = '<div class="chart-empty"><div><b>' + esc(t('noData')) + '</b>' + esc(r.shift === 'all' ? t('noRateHint') : t('noAgg')) + '</div></div>'; return; }
      if (!window.Chart) wrap.innerHTML = '<div class="chart-empty">' + esc(t('noChartLib')) + '</div>';
      else {
        wrap.innerHTML = '<canvas role="img" aria-label="' + esc(L(c.name)) + '"></canvas>';
        state.charts['res_' + s.key] = new Chart($('canvas', wrap), r.shift === 'all' ? resultRateConfig(points, c, r.periodicity) : resultShiftConfig(points, r.shift, r.periodicity));
      }
      if (single) $('.res-table', card).innerHTML = '<div class="table-scroll" style="max-height:420px">' + resultsTable(points, c, r) + '</div>';
    });
  }
  function resultRateConfig(points, c, per) {
    var vals = points.map(function (p) { return p.rate; }), n = vals.filter(isNum).length;
    var yDigits = pctDigits(vals.concat([c.goal.value]));
    return {
      type: 'line',
      data: {labels: points.map(function (p) { return fmtPeriodKey(p.key, per); }), datasets: [
        {label: t('rate'), data: vals, borderColor: RED, borderWidth: 2.2, cubicInterpolationMode: 'monotone', spanGaps: per !== 'day', fill: false,
          pointRadius: points.length > 90 ? 1.5 : 4, pointHoverRadius: 6, pointBorderColor: '#fff', pointBorderWidth: 1.5,
          pointBackgroundColor: points.map(function (p) { return p.met === true ? GOOD : p.met === false ? BAD : MUTED; })},
        {label: t('goal'), data: points.map(function () { return c.goal.value; }), borderColor: GOAL, borderDash: [6, 5], borderWidth: 1.5, pointRadius: 0, fill: false}
      ]},
      plugins: plugins(),
      options: {responsive: true, maintainAspectRatio: false, animation: {duration: 600}, interaction: {mode: 'index', intersect: false}, layout: {padding: {top: 20, right: 36}},
        plugins: {legend: {display: false},
          tooltip: {callbacks: {label: function (ctx) {
            if (ctx.datasetIndex === 1) return ' ' + t('goal') + ': ' + goalText(c.goal);
            var p = points[ctx.dataIndex]; return p.rate === null ? ' —' : ' ' + t('rate') + ': ' + fmtPct(p.rate) + ' · ' + p.days + ' ' + t('days') + (isNum(p.errors) ? ' · ' + t('errors') + ': ' + fmtInt(p.errors) : '');
          }}},
          datalabels: {display: function (ctx) { return ctx.datasetIndex === 0 && dv(ctx) !== null && dv(ctx) !== undefined && (n <= 12 || ctx.dataIndex === vals.length - 1); },
            align: 'top', offset: 4, color: INK, font: {size: 10, weight: '700'}, formatter: function (v) { return fmtPct(v); }, clip: false}},
        scales: {x: {grid: {display: false}, border: {display: false}, ticks: {autoSkip: true, maxTicksLimit: 12, maxRotation: 0}},
          y: {grid: {color: GRID}, border: {display: false}, grace: '12%', ticks: {callback: function (v) { return fmtPct(v, yDigits); }}}}}
    };
  }
  function resultShiftConfig(points, shift, per) {
    return {
      type: 'bar',
      data: {labels: points.map(function (p) { return fmtPeriodKey(p.key, per); }), datasets: [{label: shift, data: points.map(function (p) { return p.count; }),
        backgroundColor: SHIFT_COLORS[shift], borderRadius: 4, borderSkipped: 'start', maxBarThickness: 30}]},
      plugins: plugins(),
      options: {responsive: true, maintainAspectRatio: false, animation: {duration: 600}, layout: {padding: {top: 18}},
        plugins: {legend: {display: false}, tooltip: {callbacks: {label: function (ctx) {
          var p = points[ctx.dataIndex]; return p.count === null ? ' —' : ' ' + fmtInt(p.count) + ' ' + t('shipments') + ' · ' + t('shiftShareOf', {p: fmtPct(p.pct, 1)});
        }}}, datalabels: {display: function (ctx) { return dv(ctx) > 0 && points.length <= 16; }, anchor: 'end', align: 'end', offset: 2, color: INK, font: {size: 10, weight: '700'}, formatter: function (v) { return fmtInt(v); }}},
        scales: {x: {grid: {display: false}, border: {display: false}, ticks: {autoSkip: true, maxTicksLimit: 14, maxRotation: 0}},
          y: {beginAtZero: true, grace: '12%', grid: {color: GRID}, border: {display: false}, ticks: {precision: 0, callback: function (v) { return fmtInt(v); }}}}}
    };
  }
  function resultsTable(points, c, r) {
    var h, rows;
    if (r.shift === 'all') {
      h = '<th>' + esc(t('period')) + '</th><th class="num">' + esc(t('rate')) + '</th><th class="num">' + esc(t('goal')) + '</th><th>' + esc(t('status')) + '</th><th class="num">' + esc(t('errors')) + '</th><th class="num">' + esc(t('days')) + '</th>';
      rows = points.slice().reverse().filter(function (p) { return p.rate !== null; }).map(function (p) {
        return '<tr><td>' + esc(fmtPeriodKey(p.key, r.periodicity)) + '</td><td class="num"><b>' + fmtPct(p.rate) + '</b></td><td class="num">' + esc(goalText(c.goal)) + '</td><td>' +
          (p.met ? '<span style="color:var(--good);font-weight:700">✓ ' + esc(t('inGoal')) + '</span>' : '<span style="color:var(--bad);font-weight:700">✗ ' + esc(t('outGoal')) + '</span>') +
          '</td><td class="num">' + fmtInt(p.errors) + '</td><td class="num">' + p.days + '</td></tr>';
      });
    } else {
      h = '<th>' + esc(t('period')) + '</th><th class="num">' + esc(t('shiftErrors', {s: r.shift})) + '</th><th class="num">' + esc(t('errors')) + ' (T1+T2+T3)</th><th class="num">' + esc(t('share')) + '</th><th class="num">' + esc(t('days')) + '</th>';
      rows = points.slice().reverse().filter(function (p) { return p.count !== null; }).map(function (p) {
        return '<tr><td>' + esc(fmtPeriodKey(p.key, r.periodicity)) + '</td><td class="num"><b>' + fmtInt(p.count) + '</b></td><td class="num">' + fmtInt(p.total) + '</td><td class="num">' + fmtPct(p.pct, 1) + '</td><td class="num">' + p.days + '</td></tr>';
      });
    }
    return '<table class="data-table"><thead><tr>' + h + '</tr></thead><tbody>' + (rows.join('') || '<tr class="empty-row"><td colspan="6">' + esc(t('noData')) + '</td></tr>') + '</tbody></table>';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
