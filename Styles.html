<style>
/* =========================================================
   J&T EXPRESS · Painel de Indicadores — identidade branco/vermelho
   ========================================================= */
:root{
  color-scheme: light;
  --red:#E60012; --red-600:#C8000F; --red-700:#A5000C; --red-50:#FFF1F2; --red-100:#FFE1E4; --red-200:#FFC2C8;
  --ink:#1F2430; --ink-2:#434A5B; --muted:#6B7280; --muted-2:#9AA0AB;
  --line:#ECECEF; --line-2:#F3F3F5; --bg:#F6F6F8; --card:#FFFFFF;
  /* V3.38: superfícies e campos (o tema escuro troca só estes valores) */
  --soft:#F6F6F8; --soft-2:#F1F1F4; --field-line:#DFDFE4; --field-line-2:#CFCFD6; --check-line:#C9CBD3;
  --row-alt:#FBFBFC; --row-hover:#FFF5F6; --sidebar-bg:#FFFFFF; --good-soft:#F4FBF6; --bad-soft:#FFF6F6; --red-soft:#FFF3F4;
  --mark:#FFE58F; --on-ink:#FFFFFF;
  --good:#15803D; --good-bg:#EAF7EE; --good-line:#BBE5C8;
  --bad:#B42318; --bad-bg:#FDEBEC; --bad-line:#F7C3C7;
  --warn:#B45309; --warn-bg:#FFF7ED; --warn-line:#FBD9B0;
  --t1:#E60012; --t2:#2A78D6; --t3:#4A3AA7;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(31,36,48,.04),0 8px 24px rgba(31,36,48,.06);
  --shadow-lg:0 12px 40px rgba(31,36,48,.14);
  --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",Arial,sans-serif;
  --side:268px;
}
/* V3.38: tema escuro (botão no topo) — grafite com o vermelho da J&T. As cores de texto em vermelho ficam mais claras para
   ler bem no fundo escuro; os blocos vermelhos (cartão principal, botões, cabeçalho das tabelas) continuam #E60012. */
:root[data-theme="dark"]{
  color-scheme: dark;
  --red:#E60012; --red-600:#FF5A67; --red-700:#FF7D87; --red-50:rgba(230,0,18,.16); --red-100:rgba(230,0,18,.30); --red-200:rgba(255,90,103,.55);
  --ink:#F2F3F5; --ink-2:#C9CCD4; --muted:#9BA1AD; --muted-2:#727885;
  --line:#2A2D36; --line-2:#22252D; --bg:#0E0F13; --card:#17191F;
  --soft:#1E2128; --soft-2:#272A33; --field-line:#353946; --field-line-2:#4B505E; --check-line:#555B69;
  --row-alt:#1B1D24; --row-hover:rgba(230,0,18,.12); --sidebar-bg:#121318; --good-soft:rgba(34,197,94,.08); --bad-soft:rgba(230,0,18,.10); --red-soft:rgba(230,0,18,.12);
  --mark:#FFD54F; --on-ink:#111318;
  --good:#3DD07A; --good-bg:rgba(61,208,122,.14); --good-line:rgba(61,208,122,.38);
  --bad:#FF6B76; --bad-bg:rgba(230,0,18,.18); --bad-line:rgba(230,0,18,.45);
  --warn:#F5A524; --warn-bg:rgba(245,165,36,.12); --warn-line:rgba(245,165,36,.38);
  --t1:#FF3B4A; --t2:#4C93F0; --t3:#9B8CFA;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
:root[data-theme="dark"] .toast{background:#262A33;color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .toast a,:root[data-theme="dark"] .toast button{color:var(--ink)}
:root[data-theme="dark"] .sync-dot{box-shadow:0 0 0 4px rgba(22,163,74,.25)}
:root[data-theme="dark"] .sync-dot.warn{box-shadow:0 0 0 4px rgba(217,119,6,.25)}
:root[data-theme="dark"] .kpi-hero{box-shadow:0 14px 34px rgba(230,0,18,.22)}
:root[data-theme="dark"] .brand-copy strong{color:#FF3B4A}
:root[data-theme="dark"] .topbar{background:rgba(14,15,19,.94)}
:root[data-theme="dark"] .btn-dark{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(230,0,18,.22)}
:root[data-theme="dark"],:root[data-theme="dark"] body{background:var(--bg)}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.55)}
/* Botão de tema (claro/escuro) */
.theme-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow);transition:.18s}
.theme-btn:hover{color:var(--red-600);border-color:var(--red-200)}
.theme-btn .ico-sun{display:none} :root[data-theme="dark"] .theme-btn .ico-sun{display:block} :root[data-theme="dark"] .theme-btn .ico-moon{display:none}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.main{min-width:0;padding:0 28px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);scroll-margin-top:120px}

/* ---------- menu lateral ---------- */
.sidebar{position:sticky;top:0;height:100vh;background:var(--sidebar-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;z-index:40}
.sidebar::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--red),#FF4D5E)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid var(--line)}
.brand-mark{background:var(--red);color:#fff;border-radius:11px;padding:8px 11px;font-weight:900;font-size:19px;letter-spacing:-.5px;font-style:italic;box-shadow:0 6px 16px rgba(230,0,18,.25);line-height:1}
.brand-mark.big{font-size:28px;padding:12px 16px;border-radius:14px}
.brand-copy{display:flex;flex-direction:column;line-height:1.1}
.brand-copy strong{font-size:14px;letter-spacing:2.4px;color:var(--red);font-style:italic}
.brand-copy small{font-size:11px;color:var(--muted);margin-top:5px}
.side-nav{flex:1;overflow:auto;padding:14px 0;display:flex;flex-direction:column;gap:3px}
.nav-label{padding:12px 10px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted-2);font-weight:800}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:12px;color:var(--ink-2);transition:background .18s,color .18s}
.nav-item:hover{background:var(--soft);color:var(--ink)}
.nav-item.active{background:var(--red-50);color:var(--red-600)}
.nav-ico{width:34px;height:34px;border-radius:10px;background:var(--soft-2);display:grid;place-items:center;color:var(--red);transition:.18s}
.nav-item.active .nav-ico{background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(230,0,18,.25)}
.nav-copy{min-width:0;flex:1}
.nav-copy b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;font-weight:650;line-height:1.25;overflow:hidden}
.nav-copy small{display:block;font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-rate{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-rate i{width:8px;height:8px;border-radius:50%;background:var(--muted-2);display:inline-block}
.nav-rate.good i{background:#16A34A} .nav-rate.bad i{background:var(--red)}
.sidebar-foot{border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.sync-line{display:flex;gap:10px;align-items:center}
.sync-line b{display:block;font-size:12px} .sync-line small{display:block;font-size:11px;color:var(--muted)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 4px #DCFCE7;flex:none}
.sync-dot.warn{background:#D97706;box-shadow:0 0 0 4px #FEF3C7}
.sync-dot.bad{background:var(--red);box-shadow:0 0 0 4px var(--red-100)}
.queue-line{font-size:11px;color:var(--muted)}
.version{font-size:10.5px;color:var(--muted-2)}

/* ---------- topo ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,246,248,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:16px;padding:18px 0 14px;margin:0 -2px}
.title-wrap{min-width:0;flex:1}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--red)}
.dot-sep{width:4px;height:4px;border-radius:50%;background:var(--red-200)}
.title-wrap h1{margin:4px 0 2px;font-size:25px;line-height:1.15;letter-spacing:-.6px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-wrap p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lang-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.lang-btn{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);transition:.18s}
.lang-btn[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(230,0,18,.25)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;white-space:nowrap;transition:transform .12s,background .18s,box-shadow .18s,border-color .18s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-light{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.btn-light:hover{border-color:var(--red-200);color:var(--red-600)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(230,0,18,.22)}
.btn-red:hover{background:var(--red-600)}
.btn-dark{background:var(--ink);color:var(--on-ink)}
.btn-dark:hover{background:#000}
.btn-ghost{background:transparent;color:var(--muted);border-color:transparent;padding:7px 10px}
.btn-ghost:hover{color:var(--red-600);background:var(--red-50)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.btn.spin svg{animation:spin .8s linear infinite}
.menu-wrap{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;animation:pop .16s ease}
.menu-pop button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;text-align:left}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--red-50)}
.menu-pop b{font-size:13px} .menu-pop small{font-size:11.5px;color:var(--muted)}
.progress{position:sticky;top:0;height:3px;margin:0 -28px;overflow:hidden;z-index:35;opacity:0;transition:opacity .2s}
.progress.on{opacity:1}
.progress span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:slide 1.1s ease-in-out infinite}

/* ---------- barra de período ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 16px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px}
.field label,.dd-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}
.field-indicator{flex:1 1 250px}
.field-results{flex:1 1 200px}
.field-date{flex:0 1 165px}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select,input[type=date],.find input{width:100%;height:42px;border:1px solid var(--field-line);border-radius:12px;background:var(--card);padding:0 12px;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s}
select{appearance:none;-webkit-appearance:none;padding-right:34px;font-weight:600;cursor:pointer}
select:hover,input[type=date]:hover{border-color:var(--field-line-2)}
select:focus,input[type=date]:focus,.find input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,18,.10)}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;order:99;flex:1 1 100%;padding-top:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-2);transition:.16s}
.chip:hover{border-color:var(--red-200);color:var(--red-600)}
.chip.active{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}
.toolbar .btn-dark{height:42px}

.alert{margin-top:12px;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;border:1px solid var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.alert.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.alert b{display:block}
.alert .btn{margin-left:auto}
.alert .pause-body{display:grid;gap:10px;line-height:1.45}
.alert .pause-reason{display:block;margin-top:4px;font-size:12px;opacity:.8;word-break:break-word}

/* ---------- filtros (listas suspensas) ---------- */
.filters{margin-top:12px;padding:16px 18px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--red);font-weight:800}
.section-head h2{margin:2px 0 0;font-size:16px;letter-spacing:-.2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--soft-2);color:var(--ink-2);border:1px solid transparent;max-width:420px}
.badge svg{width:14px;height:14px}
.badge.ok{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.dd{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.dd-label{display:flex;align-items:center;gap:6px}
.dd-label svg{width:14px;height:14px;color:var(--red)}
.dd-btn{display:flex;align-items:center;gap:8px;width:100%;height:42px;border:1px solid var(--field-line);border-radius:12px;background:var(--card);padding:0 12px;text-align:left;transition:border-color .18s,box-shadow .18s,background .18s}
.dd-btn:hover{border-color:var(--field-line-2)}
.dd-btn[aria-expanded="true"]{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,18,.10)}
.dd.has-value .dd-btn{border-color:var(--red-200);background:var(--red-50)}
.dd-value{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
.dd.has-value .dd-value{color:var(--red-700)}
.dd-count{font-size:11px;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.dd-caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .18s;flex:none}
.dd-btn[aria-expanded="true"] .dd-caret{transform:rotate(225deg) translate(-2px,-1px)}
.dd-panel{position:absolute;left:0;top:calc(100% + 6px);width:max(100%,280px);max-width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;animation:pop .14s ease}
.dd.align-right .dd-panel{left:auto;right:0}
.dd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}
.dd-head b{font-size:12.5px}
.dd-head .btn-ghost{font-size:12px;padding:5px 8px}
.dd-head>span{display:flex;gap:4px;align-items:center}
.dd-list{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto;overscroll-behavior:contain}
.dd-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;user-select:none}
.dd-opt:hover,.dd-opt.focus{background:var(--soft)}
.dd-opt[aria-selected="true"]{background:var(--red-50)}
.dd-check{width:18px;height:18px;border-radius:6px;border:1.8px solid var(--check-line);display:grid;place-items:center;flex:none;transition:.14s;background:var(--card)}
.dd-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}
.dd-opt[aria-selected="true"] .dd-check{background:var(--red);border-color:var(--red)}
.dd-opt[aria-selected="true"] .dd-check svg{opacity:1}
.dd-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.dd-opt.zero .dd-text,.dd-opt.zero .dd-n{color:var(--muted-2)}
.dd-more{display:block;width:calc(100% - 12px);margin:4px 6px 8px;border:1px dashed var(--line);background:var(--card);border-radius:9px;padding:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.dd-empty{padding:16px;color:var(--muted);font-size:12.5px;text-align:center}
.dd-sheet-title{display:none}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.scope-note{flex-basis:100%;display:flex;align-items:flex-start;gap:6px;margin:4px 0 0;font-size:12px;line-height:1.45;color:var(--muted)}
.scope-note svg{flex:none;width:14px;height:14px;margin-top:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--red-50);border:1px solid var(--red-200);color:var(--red-700);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:650;max-width:320px}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip button{border:0;background:var(--card);color:var(--red-600);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;padding:0;flex:none}
.fchip button svg{width:12px;height:12px;stroke-width:2.6}

/* ---------- cartões ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden;min-height:118px;display:flex;flex-direction:column;animation:rise .35s ease both;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,36,48,.05),0 14px 30px rgba(31,36,48,.09)}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:7px}
.kpi-label svg{width:15px;height:15px;color:var(--red)}
.kpi-value{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:8px;line-height:1.05}
.kpi-value.text{font-size:19px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Expedição: "Login que mais mandou" e "Rota que mais enviou" — nome inteiro em até 2 linhas. */
.top-kpi .kpi-value.text{font-size:17px;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi-sub b{color:var(--ink-2)}
.kpi-gap{display:flex;align-items:flex-start;gap:6px;margin-top:6px;color:var(--bad);font-weight:600;line-height:1.35}
.kpi-gap svg{width:14px;height:14px;flex:0 0 14px;margin-top:1px}
.kpi-foot{margin-top:auto;padding-top:10px}
.bar{height:6px;border-radius:99px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.kpi.good{border-color:var(--good-line);background:linear-gradient(180deg,var(--card) 0%,var(--good-soft) 100%)}
.kpi.good .kpi-value{color:var(--good)}
.kpi.bad{border-color:var(--bad-line);background:linear-gradient(180deg,var(--card) 0%,var(--bad-soft) 100%)}
.kpi.bad .kpi-value{color:var(--bad)}
.kpi.span2{grid-column:span 2}
.kpi-value.money{font-size:26px;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.value-kpi{border-top:3px solid var(--red)}
.kpi-hero{grid-column:span 2;grid-row:span 2;background:linear-gradient(135deg,#F0101F 0%,var(--red) 40%,#B3000D 100%);border:0;color:#fff;padding:20px 22px;box-shadow:0 14px 34px rgba(230,0,18,.28)}
.kpi-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.kpi-hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.kpi-hero .kpi-label{color:rgba(255,255,255,.85)} .kpi-hero .kpi-label svg{color:#fff}
.kpi-hero .kpi-value{font-size:54px;letter-spacing:-2px;margin-top:10px;color:#fff}
.kpi-hero .kpi-sub{color:rgba(255,255,255,.88);font-size:13px}
.kpi-hero .kpi-sub b{color:#fff}
/* Filtro de turno: participação do turno em cima da taxa */
.shift-share{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.shift-share i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;display:inline-block}
.shift-share b{font-size:15px}
.hero-metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:4px 0 8px;padding:8px 12px;border-radius:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;max-width:440px}
.hero-metric span{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;opacity:.9}
.hero-metric > b{font-size:24px;letter-spacing:-.5px}
.hero-metric small{flex-basis:100%;font-size:12.5px;color:rgba(255,255,255,.9)}
.hero-metric em{font-style:normal;font-size:13px;font-weight:700;opacity:.92}
.hero-qty .kpi-value{font-size:50px}
/* Recebimento (V3.21): cartão grande "Deve chegar no dia", ao lado do vermelho (recebido) */
.kpi-big{grid-column:span 2;grid-row:span 2;padding:20px 22px;border:1px solid var(--red-100);background:linear-gradient(160deg,var(--card) 0%,var(--card) 55%,var(--red-50) 100%)}
.kpi-big .kpi-body{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.kpi-big .kpi-label{color:var(--red-600)} .kpi-big .kpi-label svg{color:var(--red)}
.kpi-big .kpi-value{letter-spacing:-2px;margin-top:10px;color:var(--ink)}
.kpi-big .hero-metric{background:var(--red-50);border-color:var(--red-200);color:var(--red-700)}
.kpi-big .hero-metric small{color:var(--ink-2)}
.kpi-big .kpi-sub{font-size:13px}
.hm-prev .mp-delta{font-size:11.5px;padding:2px 7px}
.hm-sync{font-size:11.5px;opacity:.85;margin-top:4px}
.metric-kpi .kpi-label{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:800;color:var(--ink-2);align-items:flex-start}
.metric-kpi .kpi-label .mc-name{line-height:1.3}
.metric-kpi .mc-note{color:var(--muted-2);font-size:11.5px}
.shift-kpi .sc-unit{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
/* Fluxo de Lotes (V3.23): ecológicas / não ecológicas em cada turno; taxas e Chegada/Partida */
.shift-kpi .sc-split{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.shift-kpi .sc-split span{white-space:nowrap}
.pct-kpi .mp-delta,.detail-kpi .mp-delta{font-size:11.5px;padding:2px 7px}
.good-metric .kpi-label svg{color:var(--good)}
.detail-kpi .kpi-label svg{color:var(--ink-2)}
.nav-rate.nav-qty i{background:var(--red)}
.list-table + .list-table{margin-top:16px}
#listTables:not(:empty){margin-top:16px}
#metricTable:not(:empty){margin-top:16px}
.metric-kpi .kpi-value{margin-top:4px}
/* Recebimento: os três turnos numa linha própria do grid de cartões */
.shift-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.shift-row{grid-template-columns:1fr}}
/* Recebimento (4 colunas): cartão principal 2×2 + 4 cartões ao lado; 3ª linha = último cartão + T1, T2, T3 */
/* "Feito por Caike Oliveira" enquanto carrega */
.boot-card .made-by{margin-top:6px;color:var(--red);font-size:12.5px;letter-spacing:.3px}
.loading-credit{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);z-index:250;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:0 10px 30px rgba(15,23,42,.14);
  font-size:12.5px;color:var(--ink-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.loading-credit.on{opacity:1;transform:translate(-50%,0)}
.loading-credit .mini-loader{width:14px;height:14px;border-radius:50%;border:2px solid var(--red-100);border-top-color:var(--red);animation:spin .8s linear infinite}
.loading-credit b{color:var(--red)}
.metric-kpi .kpi-sub .mp-delta{font-size:11px;padding:2px 7px}
/* Filtro de turno: os turnos não escolhidos ficam apagados (no conteúdo: a animação de entrada do cartão termina em opacidade 1) */
.shift-kpi.faded > *{opacity:.45}
.shift-kpi.faded{background:var(--row-alt)}
.shift-kpi .part{color:var(--red)}
.hero-parts span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.hero-parts i{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;display:inline-block}
.shift-kpi.selected{box-shadow:0 0 0 2px var(--red) inset}
.hero-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1F2430;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.status-pill.good{color:var(--good)} .status-pill.bad{color:var(--bad)} .status-pill.none{color:var(--muted)}
.status-pill svg{width:15px;height:15px;stroke-width:2.6}
.hero-goal{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px}
.spark{margin-top:auto;height:70px;position:relative;z-index:1}
.spark canvas{width:100%!important;height:70px!important}
.kpi-hero .kpi-body{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
/* V4.31 (pedido, print "Taxa do dia"): cartão vermelho principal no formato do print. As medidas seguem a largura do
   cartão (--u = 1% dela), como no print: cabeçalho com o ícone num quadrado, traço e título em maiúsculas; o número grande
   à esquerda com as pílulas embaixo; um traço vertical; as informações à direita, uma por linha, com ícone e separador;
   a minilinha embaixo, de ponta a ponta (cresce se o cartão ficar mais alto, sem espaço vazio). */
.kpi-hero.hx{container-type:inline-size;padding:0;background:linear-gradient(174deg,#DD0313 0%,#CE0210 24%,#BC010C 55%,#AA010A 100%)}
.kpi-hero.hx::after{right:auto;left:66.6%;top:-156%;width:68.6%;height:auto;aspect-ratio:1;background:linear-gradient(205deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.085) 60%,rgba(255,255,255,.05) 100%)}
.kpi-hero.hx::before{right:auto;bottom:auto;left:51.7%;top:53.6%;width:110.4%;height:auto;aspect-ratio:1;
  background:radial-gradient(circle closest-side,rgba(255,255,255,.035) 0%,rgba(255,255,255,.05) 74%,rgba(255,120,128,.16) 96%,rgba(255,170,175,.24) 99.4%,rgba(255,255,255,0) 100%)}
.hx .kpi-body{--u:clamp(6.2px,1cqi,11px);padding:calc(1.45*var(--u)) calc(3.5*var(--u)) calc(3*var(--u));position:relative;z-index:1}
.hx-deco{position:absolute;z-index:-1;left:65.5%;top:-110%;width:115%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:linear-gradient(225deg,rgba(255,255,255,.05),rgba(255,255,255,.025) 60%,rgba(255,255,255,0))}
.hx-head{display:flex;align-items:center;gap:calc(1.9*var(--u));min-width:0}
.hx-ico{width:calc(4*var(--u));height:calc(4*var(--u));border-radius:calc(.8*var(--u));background:rgba(255,255,255,.13);display:grid;place-items:center;flex:none}
.hx-ico svg{width:calc(3*var(--u));height:calc(3*var(--u));color:#fff;stroke-width:2.4}
.hx-sep{width:max(1px,calc(.1*var(--u)));height:calc(2.3*var(--u));background:rgba(255,255,255,.45);flex:none}
.hx-title{font-size:calc(2.48*var(--u));font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1.1;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-main{display:flex;align-items:stretch;margin-top:calc(2.4*var(--u));min-width:0}
.hx-left{flex:none;display:flex;flex-direction:column;justify-content:center;padding-right:calc(1.9*var(--u));border-right:max(1px,calc(.1*var(--u))) solid rgba(255,255,255,.35)}
.kpi-hero.hx .kpi-value{font-size:calc(13.4*var(--u)*var(--fs,1));font-weight:900;letter-spacing:-.035em;line-height:.86;margin:calc(-.75*var(--u)) 0 0 calc(-.5*var(--u));color:#fff;white-space:nowrap}
.hx-pills{display:flex;align-items:center;gap:calc(1.5*var(--u));margin-top:calc(2*var(--u));flex-wrap:nowrap}
.hx .status-pill,.hx .hero-goal{display:inline-flex;align-items:center;gap:calc(1.45*var(--u));height:calc(4.1*var(--u));padding:0 calc(1.9*var(--u));border-radius:999px;
  font-size:calc(2.05*var(--u));font-weight:800;letter-spacing:-.01em;white-space:nowrap;box-sizing:border-box}
.hx .status-pill{background:rgba(255,255,255,.89);padding-left:calc(2*var(--u))}
.hx .status-pill.bad{color:#A8000F} .hx .status-pill.bad svg{color:#DC0A1E}
.hx .status-pill.good{color:#0B7A3E} .hx .status-pill.none{color:#5B6170}
.hx .status-pill svg{width:calc(2.2*var(--u));height:calc(2.2*var(--u));stroke-width:2.9}
.hx .hero-goal{background:rgba(255,255,255,.15);border:max(1px,calc(.1*var(--u))) solid rgba(255,255,255,.32);color:#fff}
.hx-right{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;margin-top:calc(-1.25*var(--u));padding-left:calc(1.85*var(--u))}
.hx-row{display:flex;align-items:center;gap:calc(1.35*var(--u));min-height:calc(5.75*var(--u));padding:calc(.5*var(--u)) 0;box-sizing:border-box;
  font-size:calc(1.86*var(--u));font-weight:500;line-height:1.3;color:#fff}
.hx-row + .hx-row{border-top:max(1px,calc(.1*var(--u))) solid rgba(255,255,255,.35)}
.hx-row > svg{width:calc(3.2*var(--u));height:calc(3.2*var(--u));color:#fff;stroke-width:1.75;flex:none}
.hx-text{min-width:0}
.hx-text b{font-weight:800;color:#fff}
.hx-text .hx-em{font-size:1.2em;letter-spacing:-.01em}
.hx-parts{margin-left:.45em}
.hx-parts span{white-space:nowrap}
.hx-row.hx-small{font-size:calc(1.62*var(--u))}
.hx-dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
.hx-dots i{width:.6em;height:.6em;border-radius:50%;border:1.5px solid #fff;display:inline-block}
.hx .delta{font-size:.9em}
.hx .spark{flex:1 1 auto;margin-top:calc(2.6*var(--u));min-height:calc(7.8*var(--u));height:auto;position:relative}
.hx .spark canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.hx-unit{font-size:.3em;font-weight:800;letter-spacing:0;margin-left:.12em}
/* Sem a minilinha (Tempo real): o número e as informações ocupam o cartão. */
.hx .hx-main:last-child{flex:1}
.hx .hx-main:last-child > .hx-right{justify-content:center;margin-top:0}
/* V4.34: Premiação do abastecimento (Produção do Sorter). Cores das classificações da tabela de avaliação. */
:root{--aw-nao-bg:#EEF0F3;--aw-nao-fg:#5B6170;--aw-at-bg:#DDF4E4;--aw-at-fg:#11713A;--aw-bom-bg:#B4E8C5;--aw-bom-fg:#0B5A2C;
  --aw-exc-bg:#CFE2FF;--aw-exc-fg:#123F8C;--aw-top-bg:#F7B500;--aw-top-fg:#3A2700}
:root[data-theme="dark"]{--aw-nao-bg:#2A2D36;--aw-nao-fg:#A3A9B6;--aw-at-bg:rgba(34,197,94,.16);--aw-at-fg:#7EE2A2;--aw-bom-bg:rgba(34,197,94,.34);--aw-bom-fg:#C9F7D9;
  --aw-exc-bg:rgba(59,130,246,.32);--aw-exc-fg:#CFE0FF;--aw-top-bg:#E8A900;--aw-top-fg:#241800}
/* V4.34.3: cabeçalho da Premiação no estilo do cartão da taxa do dia. */
.aw-hero{position:relative;overflow:hidden;border-radius:18px;padding:18px 22px 16px;color:#fff;
  background:linear-gradient(135deg,#F0101F 0%,var(--red) 42%,#B3000D 100%);box-shadow:0 14px 34px rgba(230,0,18,.22)}

.aw-hdeco{position:absolute;right:320px;bottom:-150px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.aw-hmain{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.aw-hico{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;flex:none}
.aw-hico svg{width:29px;height:29px;color:#fff}
.aw-htext{min-width:220px;flex:1}
.aw-hkick{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.78)}
.aw-htext h2{margin:3px 0 0;font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2;color:#fff}
.aw-hzh{font-size:13px;font-weight:600;color:rgba(255,255,255,.86);margin-top:3px}
.aw-hctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aw-dgroup{display:flex;align-items:center;height:44px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);overflow:hidden}
.aw-dgroup button{flex:none;width:42px;height:100%;border:0;background:transparent;color:#fff;font-size:21px;font-weight:700;cursor:pointer;line-height:1}
.aw-dgroup button:hover{background:rgba(255,255,255,.16)}
.aw-dfield{display:flex;align-items:center;min-width:0;height:100%;padding:0 10px;border-left:1px solid rgba(255,255,255,.25);border-right:1px solid rgba(255,255,255,.25)}
.aw-dfield input{min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-weight:800;font-size:14.5px;color-scheme:dark;outline:none;width:140px;cursor:pointer}
.aw-reload{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:0;background:#fff;color:#B3000D;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.aw-reload svg{width:17px;height:17px;color:#B3000D}
.aw-reload:hover{background:#FFF1F2}
.aw-reload:disabled{opacity:.75;cursor:progress}
.aw-hchips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-left:70px}
.aw-hchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.aw-hchip svg{width:14px;height:14px;color:#fff;flex:none}
.aw-hchip.live{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.aw-hchip.ok{background:#fff;color:#11713A;border-color:transparent}
.aw-hchip.ok svg{color:#11713A}
.aw-hdot{width:8px;height:8px;border-radius:50%;background:#FFD43B;display:inline-block;animation:awpulse 1.6s infinite}
@media (max-width:760px){.aw-hero{padding:16px}.aw-hchips{padding-left:0}.aw-hctl{width:100%}.aw-dgroup{flex:1 1 230px}.aw-dfield{flex:1;justify-content:center}.aw-dfield input{width:100%;text-align:center}.aw-reload{flex:1 1 auto;justify-content:center}.aw-htext h2{font-size:19px}}
.aw-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.aw-title{display:flex;gap:12px;align-items:center;min-width:0}
.aw-title h2{margin:0;font-size:18px}
.aw-title p{margin:2px 0 0}
.aw-ico{width:42px;height:42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}

.aw-date{display:flex;gap:8px;align-items:center}
.aw-date input{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit}
.aw-date .btn{height:38px}
.aw-status{flex-basis:100%;margin:0;color:var(--muted);display:flex;align-items:center;gap:6px}
.aw-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.aw-dot.ok{background:var(--good)}.aw-dot.live{background:var(--red);animation:awpulse 1.6s infinite}
@keyframes awpulse{0%,100%{opacity:1}50%{opacity:.3}}
.aw-empty{display:flex;align-items:center;gap:12px;justify-content:center;padding:40px}
.aw-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.aw-geral{border-top:3px solid var(--aw-top-bg)}
.aw-geral .kpi-value.text{font-size:18px}
.aw-shifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.aw-shift{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.aw-sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px}
.aw-sh i{width:11px;height:11px;border-radius:3px;display:inline-block}
.aw-shstat{margin-left:auto;font-size:12px;color:var(--muted)}
.aw-block{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--row-alt)}
.aw-bt{font-weight:800;font-size:13px;margin-bottom:8px;display:flex;flex-direction:column;gap:1px}

.aw-podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.aw-medal{font-size:24px;line-height:1}
.aw-pbody{min-width:0;flex:1}
.aw-sub{color:var(--muted);margin-top:2px}
.aw-badge{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--aw-top-bg);color:var(--aw-top-fg);margin-left:4px}
.aw-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.aw-chip small{font-weight:600;opacity:.85}
.aw-nao{background:var(--aw-nao-bg);color:var(--aw-nao-fg)}

/* ---------- Maomao (V3.38: imagens do usuário, animadas; acima dos cartões; letras maiores) ---------- */
.target{margin-top:12px;display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:22px;padding:14px 28px;min-height:210px;overflow:hidden;position:relative}
.target.good{background:linear-gradient(90deg,var(--card) 0%,var(--good-soft) 100%);border-color:var(--good-line)}
.target.bad{background:linear-gradient(90deg,var(--card) 0%,var(--bad-soft) 100%);border-color:var(--bad-line)}
.target-copy h3{margin:10px 0 6px;font-size:30px;line-height:1.15;letter-spacing:-.6px}
.target-copy p{margin:0;color:var(--ink-2);font-size:17px;line-height:1.45;max-width:720px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;letter-spacing:1.2px;border-radius:999px;padding:6px 14px;background:var(--soft-2);color:var(--muted)}
.target.good .pill{background:var(--good);color:#fff} .target.bad .pill{background:var(--red);color:#fff}
.target-goal{text-align:right}
.target-goal span{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.target-goal strong{font-size:40px;letter-spacing:-1px;line-height:1.1}
.maomao{height:200px;width:200px;display:grid;place-items:center;position:relative}
.mascot-sprite{height:200px;width:200px;position:relative}
.mao-shadow{position:absolute;left:50%;bottom:2px;width:104px;height:12px;margin-left:-52px;border-radius:50%;background:rgba(0,0,0,.16);filter:blur(2px)}
:root[data-theme="dark"] .mao-shadow{background:rgba(0,0,0,.55)}
/* V3.40: o Maomao se mexe pelos próprios quadros (animação quadro a quadro, como um GIF): braços, perna, cabeça e orelhas
   dançando na meta; soluçando e chorando fora da meta. A imagem inteira NÃO balança. */
.mao-fig{position:absolute;left:0;right:0;bottom:4px;margin:auto;height:196px;opacity:0;transition:opacity .35s}
.mao-fig img{display:block;width:100%;height:100%;object-fit:contain}
.mao-fig.mao-happy{aspect-ratio:var(--mao-happy-ratio,.66)}
.mao-fig.mao-sad{aspect-ratio:var(--mao-sad-ratio,.6)}
.target.good .mao-happy{opacity:1}
.target.bad .mao-sad{opacity:1}
/* Sem taxa oficial: Maomao parado e esmaecido (não é "fora da meta"). */
.target.neutral .mao-still{opacity:.4;filter:grayscale(1)}
/* Quem pede "menos movimento" no sistema vê o 1º quadro parado. */
.mao-fig .mao-still-img{display:none}
@media (prefers-reduced-motion: reduce){.mao-fig .mao-anim-img{display:none}.mao-fig .mao-still-img{display:block}}
