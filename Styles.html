<style>
/* =========================================================
   J&T EXPRESS · Painel de Indicadores — identidade branco/vermelho
   ========================================================= */
:root{
  color-scheme: light;
  --red:#E60012; --red-600:#C8000F; --red-700:#A5000C; --red-50:#FFF1F2; --red-100:#FFE1E4; --red-200:#FFC2C8;
  --ink:#1F2430; --ink-2:#434A5B; --muted:#6B7280; --muted-2:#9AA0AB;
  --line:#ECECEF; --line-2:#F3F3F5; --bg:#F6F6F8; --card:#FFFFFF;
  --good:#15803D; --good-bg:#EAF7EE; --good-line:#BBE5C8;
  --bad:#B42318; --bad-bg:#FDEBEC; --bad-line:#F7C3C7;
  --warn:#B45309; --warn-bg:#FFF7ED; --warn-line:#FBD9B0;
  --t1:#E60012; --t2:#2A78D6; --t3:#4A3AA7;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(31,36,48,.04),0 8px 24px rgba(31,36,48,.06);
  --shadow-lg:0 12px 40px rgba(31,36,48,.14);
  --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",Arial,sans-serif;
  --side:268px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.main{min-width:0;padding:0 28px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);scroll-margin-top:120px}

/* ---------- menu lateral ---------- */
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;z-index:40}
.sidebar::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--red),#FF4D5E)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid var(--line)}
.brand-mark{background:var(--red);color:#fff;border-radius:11px;padding:8px 11px;font-weight:900;font-size:19px;letter-spacing:-.5px;font-style:italic;box-shadow:0 6px 16px rgba(230,0,18,.25);line-height:1}
.brand-mark.big{font-size:28px;padding:12px 16px;border-radius:14px}
.brand-copy{display:flex;flex-direction:column;line-height:1.1}
.brand-copy strong{font-size:14px;letter-spacing:2.4px;color:var(--red);font-style:italic}
.brand-copy small{font-size:11px;color:var(--muted);margin-top:5px}
.side-nav{flex:1;overflow:auto;padding:14px 0;display:flex;flex-direction:column;gap:3px}
.nav-label{padding:12px 10px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted-2);font-weight:800}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:12px;color:var(--ink-2);transition:background .18s,color .18s}
.nav-item:hover{background:#F7F7F9;color:var(--ink)}
.nav-item.active{background:var(--red-50);color:var(--red-600)}
.nav-ico{width:34px;height:34px;border-radius:10px;background:#F4F4F6;display:grid;place-items:center;color:var(--red);transition:.18s}
.nav-item.active .nav-ico{background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(230,0,18,.25)}
.nav-copy{min-width:0;flex:1}
.nav-copy b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;font-weight:650;line-height:1.25;overflow:hidden}
.nav-copy small{display:block;font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-rate{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-rate i{width:8px;height:8px;border-radius:50%;background:var(--muted-2);display:inline-block}
.nav-rate.good i{background:#16A34A} .nav-rate.bad i{background:var(--red)}
.sidebar-foot{border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.sync-line{display:flex;gap:10px;align-items:center}
.sync-line b{display:block;font-size:12px} .sync-line small{display:block;font-size:11px;color:var(--muted)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 4px #DCFCE7;flex:none}
.sync-dot.warn{background:#D97706;box-shadow:0 0 0 4px #FEF3C7}
.sync-dot.bad{background:var(--red);box-shadow:0 0 0 4px var(--red-100)}
.queue-line{font-size:11px;color:var(--muted)}
.version{font-size:10.5px;color:var(--muted-2)}

/* ---------- topo ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,246,248,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:16px;padding:18px 0 14px;margin:0 -2px}
.title-wrap{min-width:0;flex:1}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--red)}
.dot-sep{width:4px;height:4px;border-radius:50%;background:var(--red-200)}
.title-wrap h1{margin:4px 0 2px;font-size:25px;line-height:1.15;letter-spacing:-.6px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-wrap p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lang-switch{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.lang-btn{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);transition:.18s}
.lang-btn[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(230,0,18,.25)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;white-space:nowrap;transition:transform .12s,background .18s,box-shadow .18s,border-color .18s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-light{background:#fff;border-color:var(--line);box-shadow:var(--shadow)}
.btn-light:hover{border-color:var(--red-200);color:var(--red-600)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(230,0,18,.22)}
.btn-red:hover{background:var(--red-600)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{background:transparent;color:var(--muted);border-color:transparent;padding:7px 10px}
.btn-ghost:hover{color:var(--red-600);background:var(--red-50)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.btn.spin svg{animation:spin .8s linear infinite}
.menu-wrap{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;animation:pop .16s ease}
.menu-pop button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;text-align:left}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--red-50)}
.menu-pop b{font-size:13px} .menu-pop small{font-size:11.5px;color:var(--muted)}
.progress{position:sticky;top:0;height:3px;margin:0 -28px;overflow:hidden;z-index:35;opacity:0;transition:opacity .2s}
.progress.on{opacity:1}
.progress span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:slide 1.1s ease-in-out infinite}

/* ---------- barra de período ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 16px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px}
.field label,.dd-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}
.field-indicator{flex:1 1 250px}
.field-results{flex:1 1 200px}
.field-date{flex:0 1 165px}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select,input[type=date],.find input{width:100%;height:42px;border:1px solid #DFDFE4;border-radius:12px;background:#fff;padding:0 12px;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s}
select{appearance:none;-webkit-appearance:none;padding-right:34px;font-weight:600;cursor:pointer}
select:hover,input[type=date]:hover{border-color:#CFCFD6}
select:focus,input[type=date]:focus,.find input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,18,.10)}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;order:99;flex:1 1 100%;padding-top:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-2);transition:.16s}
.chip:hover{border-color:var(--red-200);color:var(--red-600)}
.chip.active{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}
.toolbar .btn-dark{height:42px}

.alert{margin-top:12px;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;border:1px solid var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.alert.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.alert b{display:block}
.alert .btn{margin-left:auto}
.alert .pause-body{display:grid;gap:10px;line-height:1.45}
.alert .pause-reason{display:block;margin-top:4px;font-size:12px;opacity:.8;word-break:break-word}

/* ---------- filtros (listas suspensas) ---------- */
.filters{margin-top:12px;padding:16px 18px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--red);font-weight:800}
.section-head h2{margin:2px 0 0;font-size:16px;letter-spacing:-.2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 10px;background:#F3F4F6;color:var(--ink-2);border:1px solid transparent;max-width:420px}
.badge svg{width:14px;height:14px}
.badge.ok{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.dd{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.dd-label{display:flex;align-items:center;gap:6px}
.dd-label svg{width:14px;height:14px;color:var(--red)}
.dd-btn{display:flex;align-items:center;gap:8px;width:100%;height:42px;border:1px solid #DFDFE4;border-radius:12px;background:#fff;padding:0 12px;text-align:left;transition:border-color .18s,box-shadow .18s,background .18s}
.dd-btn:hover{border-color:#CFCFD6}
.dd-btn[aria-expanded="true"]{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,18,.10)}
.dd.has-value .dd-btn{border-color:var(--red-200);background:var(--red-50)}
.dd-value{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
.dd.has-value .dd-value{color:var(--red-700)}
.dd-count{font-size:11px;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.dd-caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .18s;flex:none}
.dd-btn[aria-expanded="true"] .dd-caret{transform:rotate(225deg) translate(-2px,-1px)}
.dd-panel{position:absolute;left:0;top:calc(100% + 6px);width:max(100%,280px);max-width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;animation:pop .14s ease}
.dd.align-right .dd-panel{left:auto;right:0}
.dd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}
.dd-head b{font-size:12.5px}
.dd-head .btn-ghost{font-size:12px;padding:5px 8px}
.dd-head>span{display:flex;gap:4px;align-items:center}
.dd-list{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto;overscroll-behavior:contain}
.dd-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;user-select:none}
.dd-opt:hover,.dd-opt.focus{background:#F6F6F8}
.dd-opt[aria-selected="true"]{background:var(--red-50)}
.dd-check{width:18px;height:18px;border-radius:6px;border:1.8px solid #C9CBD3;display:grid;place-items:center;flex:none;transition:.14s;background:#fff}
.dd-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}
.dd-opt[aria-selected="true"] .dd-check{background:var(--red);border-color:var(--red)}
.dd-opt[aria-selected="true"] .dd-check svg{opacity:1}
.dd-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.dd-opt.zero .dd-text,.dd-opt.zero .dd-n{color:var(--muted-2)}
.dd-more{display:block;width:calc(100% - 12px);margin:4px 6px 8px;border:1px dashed var(--line);background:#fff;border-radius:9px;padding:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.dd-empty{padding:16px;color:var(--muted);font-size:12.5px;text-align:center}
.dd-sheet-title{display:none}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--red-50);border:1px solid var(--red-200);color:var(--red-700);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:650;max-width:320px}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip button{border:0;background:#fff;color:var(--red-600);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;padding:0;flex:none}
.fchip button svg{width:12px;height:12px;stroke-width:2.6}

/* ---------- cartões ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden;min-height:118px;display:flex;flex-direction:column;animation:rise .35s ease both;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,36,48,.05),0 14px 30px rgba(31,36,48,.09)}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:7px}
.kpi-label svg{width:15px;height:15px;color:var(--red)}
.kpi-value{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:8px;line-height:1.05}
.kpi-value.text{font-size:19px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi-sub b{color:var(--ink-2)}
.kpi-foot{margin-top:auto;padding-top:10px}
.bar{height:6px;border-radius:99px;background:#F1F1F4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.kpi.good{border-color:var(--good-line);background:linear-gradient(180deg,#fff 0%,#F4FBF6 100%)}
.kpi.good .kpi-value{color:var(--good)}
.kpi.bad{border-color:var(--bad-line);background:linear-gradient(180deg,#fff 0%,#FFF6F6 100%)}
.kpi.bad .kpi-value{color:var(--bad)}
.kpi.span2{grid-column:span 2}
.kpi-hero{grid-column:span 2;grid-row:span 2;background:linear-gradient(135deg,#F0101F 0%,var(--red) 40%,#B3000D 100%);border:0;color:#fff;padding:20px 22px;box-shadow:0 14px 34px rgba(230,0,18,.28)}
.kpi-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.kpi-hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.kpi-hero .kpi-label{color:rgba(255,255,255,.85)} .kpi-hero .kpi-label svg{color:#fff}
.kpi-hero .kpi-value{font-size:54px;letter-spacing:-2px;margin-top:10px;color:#fff}
.kpi-hero .kpi-sub{color:rgba(255,255,255,.88);font-size:13px}
.kpi-hero .kpi-sub b{color:#fff}
.hero-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.status-pill.good{color:var(--good)} .status-pill.bad{color:var(--bad)} .status-pill.none{color:var(--muted)}
.status-pill svg{width:15px;height:15px;stroke-width:2.6}
.hero-goal{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px}
.spark{margin-top:auto;height:70px;position:relative;z-index:1}
.spark canvas{width:100%!important;height:70px!important}
.kpi-hero .kpi-body{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.shift-kpi .kpi-label i{width:10px;height:10px;border-radius:3px;display:inline-block}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.delta svg{width:14px;height:14px;stroke-width:2.6}

/* ---------- Maomao ---------- */
.target{margin-top:12px;display:grid;grid-template-columns:170px 1fr auto;align-items:center;gap:16px;padding:12px 22px;min-height:160px;overflow:hidden;position:relative}
.target.good{background:linear-gradient(90deg,#fff 0%,#F2FBF4 100%);border-color:var(--good-line)}
.target.bad{background:linear-gradient(90deg,#fff 0%,#FFF4F5 100%);border-color:var(--bad-line)}
.target-copy h3{margin:8px 0 4px;font-size:20px;letter-spacing:-.3px}
.target-copy p{margin:0;color:var(--ink-2);font-size:13px;max-width:640px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:1px;border-radius:999px;padding:5px 10px;background:#F3F4F6;color:var(--muted)}
.target.good .pill{background:var(--good);color:#fff} .target.bad .pill{background:var(--red);color:#fff}
.target-goal{text-align:right}
.target-goal span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.target-goal strong{font-size:28px;letter-spacing:-.8px}
.maomao{height:142px;width:170px;display:grid;place-items:center;position:relative}
.mascot-sprite{height:142px;width:170px;position:relative}
.mao-img{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;height:100%;width:auto;max-width:100%;object-fit:contain;mix-blend-mode:multiply;filter:brightness(1.025);transition:opacity .3s,transform .5s;
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* Bordas esfumadas: a "caixa" clara ao redor do desenho desaparece sem alterar o Maomao. */
.mao-img-happy{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(180deg,transparent 0,#000 16%,#000 95%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(180deg,transparent 0,#000 16%,#000 95%,transparent 100%)}
.mao-img-sad{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 78%,transparent 100%),linear-gradient(180deg,transparent 0,#000 20%,#000 95%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 78%,transparent 100%),linear-gradient(180deg,transparent 0,#000 20%,#000 95%,transparent 100%)}
